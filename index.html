<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricelist Toko Kue - Menu Spesial Premium</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan kombinasi Playfair Display (judul mewah) dan Poppins (teks nyaman) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Memuat berkas data menu eksternal -->
    <script src="menu.data.js"></script>
</head>
<body>

    <!-- Pembungkus Utama Aplikasi -->
    <div class="app-wrapper">
        
        <!-- Header Profil Toko (Glassmorphism & Elegant) -->
        <header class="header">
            <div class="logo-container">
                <!-- Ganti logo.jpg dengan logo toko kue jika ada -->
                <img src="logo.png" alt="Logo Toko Kue" class="logo-toko" onerror="this.src='https://images.unsplash.com/photo-1511018556340-d16986a1c194?w=150'">
            </div>
            <h1>@puding_ulangtahunnnn</h1>
            <p class="subtitle">Freshly baked every day with love ✨</p>
        </header>

        <!-- Elegant Hero Slider Section -->
        <div class="hero-slider-container">
            <div class="hero-slider" id="hero-slider">
                <!-- Slides will be injected dynamically via JavaScript -->
            </div>
            <!-- Slider dots pagination -->
            <div class="slider-dots" id="slider-dots"></div>
        </div>
    
        <!-- Kontainer Menu/Pricelist (Akan diisi dinamis oleh JavaScript) -->
        <main class="menu-container" id="menu-container">
            <div class="loading-state" style="text-align: center; color: var(--color-text-muted); font-size: 0.95rem; padding: 60px 0;">
                Memuat menu spesial... ✨
            </div>
        </main>
        
    </div>

    <!-- Tombol Order WhatsApp Melayang (Sticky Button with Pulse Animation) -->
    <div class="cta-container">
        <!-- Ganti nomor 628xxx dengan nomor WhatsApp toko kue Anda -->
        <a href="https://wa.me/6287755620998?text=Halo%20kak,%20saya%20tertarik%20untuk%20tanya-tanya%20tentang%20menu%20kuenya" class="btn-whatsapp" target="_blank" rel="noopener noreferrer">
            <svg class="icon-wa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L3 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
            </svg>
            Hubungi Admin / Order via WA
        </a>
    </div>

    <!-- Logika Javascript untuk Rendering Menu -->
    <script>
        let currentSlideIndex = 0;
        let slideInterval = null;
        let allItems = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            if (!container) return;

            // Pastikan data menu termuat
            if (!window.menuData || window.menuData.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: var(--color-text-muted); padding: 60px 20px;">
                        <p style="font-size: 1.1rem; font-weight: 500; margin-bottom: 8px;">Menu belum tersedia</p>
                        <p style="font-size: 0.88rem;">Silakan tambahkan kategori dan kue melalui panel admin.</p>
                    </div>
                `;
                return;
            }

            // Kumpulkan semua item untuk slider
            allItems = [];
            window.menuData.forEach(cat => {
                if (cat.items && cat.items.length > 0) {
                    cat.items.forEach(item => {
                        allItems.push({
                            ...item,
                            category: cat.category
                        });
                    });
                }
            });

            // Jalankan rendering Hero Slider jika ada item
            if (allItems.length > 0) {
                renderHeroSlider();
                initSlider();
            } else {
                // Sembunyikan kontainer slider jika tidak ada menu
                const sliderContainer = document.querySelector('.hero-slider-container');
                if (sliderContainer) sliderContainer.style.display = 'none';
            }

            // Render grid menu utama
            let htmlContent = '';
            const pastelColors = [
                'var(--bg-pastel-1)', 
                'var(--bg-pastel-2)', 
                'var(--bg-pastel-3)', 
                'var(--bg-pastel-4)', 
                'var(--bg-pastel-5)'
            ];

            let globalItemCount = 0;

            window.menuData.forEach(cat => {
                // Lewati kategori jika tidak ada produk di dalamnya
                if (!cat.items || cat.items.length === 0) return;

                htmlContent += `
                    <!-- Kategori: ${cat.category} -->
                    <div class="category-section">
                        <h2 class="category-title">${cat.category}</h2>
                        <div class="menu-grid">
                `;

                cat.items.forEach((item, itemIdx) => {
                    // Penyiapan lencana (badge)
                    let badgeHtml = '';
                    if (item.badge && item.badge.trim() !== '') {
                        const badgeClass = item.badge.toLowerCase().replace(/\s+/g, '');
                        badgeHtml = `<span class="menu-badge badge-${badgeClass}">${item.badge}</span>`;
                    }

                    // Tentukan fallback gambar Unsplash otomatis berdasarkan kata kunci nama produk
                    let unsplashFallback = 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500'; // Default coklat
                    const nameLower = item.name.toLowerCase();
                    if (nameLower.includes('straw') || nameLower.includes('berry') || nameLower.includes('buah')) {
                        unsplashFallback = 'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=500'; // Strawberry
                    } else if (nameLower.includes('croissant') || nameLower.includes('bread') || nameLower.includes('roti') || nameLower.includes('pastry')) {
                        unsplashFallback = 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500'; // Croissant/Baking
                    } else if (nameLower.includes('puding') || nameLower.includes('jelly') || nameLower.includes('pudding')) {
                        unsplashFallback = 'https://images.unsplash.com/photo-1548859135-2442436d547d?w=500'; // Pudding
                    } else if (nameLower.includes('cheese') || nameLower.includes('keju')) {
                        unsplashFallback = 'https://images.unsplash.com/photo-1524351199679-46cddf530c04?w=500'; // Cheesecake
                    }

                    // Source gambar: jika kosong, langsung pakai fallback
                    const imgSrc = (item.img && item.img.trim() !== '') ? item.img : unsplashFallback;
                    
                    // Ambil warna pastel berurutan agar estetik
                    const currentBg = pastelColors[globalItemCount % pastelColors.length];
                    globalItemCount++;

                    // Dapatkan nomor WA dinamis
                    const waLinkEl = document.querySelector('.btn-whatsapp');
                    const waNumber = waLinkEl ? waLinkEl.getAttribute('href').split('?')[0].split('/').pop() : '6287755620998';
                    const waText = encodeURIComponent(`Halo kak, mau pesan ${item.name} ini kak?`);
                    const waItemHref = `https://wa.me/${waNumber}?text=${waText}`;

                    htmlContent += `
                            <!-- Item Kue: ${item.name} -->
                            <div class="menu-item">
                                <div class="menu-img-wrapper" style="background-color: ${currentBg};">
                                    ${badgeHtml}
                                    <img src="${imgSrc}" alt="${item.name}" class="menu-img" onerror="this.onerror=null; this.src='${unsplashFallback}';">
                                    <a href="${waItemHref}" class="menu-details-pill" target="_blank" rel="noopener noreferrer">Pesan via WA</a>
                                </div>
                                <div class="menu-info">
                                    <div class="menu-header">
                                        <h3 class="menu-name">${item.name}</h3>
                                        <span class="menu-price">${item.price}</span>
                                    </div>
                                </div>
                            </div>
                    `;
                });

                htmlContent += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent || `
                <div style="text-align: center; color: var(--color-text-muted); padding: 60px 20px;">
                    <p style="font-size: 1.1rem; font-weight: 500;">Belum ada menu aktif.</p>
                </div>
            `;
        }

        // Render Slide di dalam Hero Section
        function renderHeroSlider() {
            const slider = document.getElementById('hero-slider');
            const dotsContainer = document.getElementById('slider-dots');
            if (!slider || !dotsContainer) return;

            let slidesHtml = '';
            let dotsHtml = '';

            const slideGradients = [
                'linear-gradient(135deg, #c09584 0%, #aa7b69 100%)', // Rose gold/terracotta
                'linear-gradient(135deg, #4a3b32 0%, #2e241e 100%)', // Rich chocolate
                'linear-gradient(135deg, #8c9c8e 0%, #6b7c6d 100%)', // Soft sage green
                'linear-gradient(135deg, #a88d75 0%, #8d735c 100%)', // Warm caramel
                'linear-gradient(135deg, #6c809a 0%, #4f637d 100%)'  // Dusty blue
            ];

            // Batasi maksimal 8 item terbaik untuk diputar di slider agar efisien
            const sliderItems = allItems.slice(0, 8);

            sliderItems.forEach((item, idx) => {
                // Tentukan fallback gambar Unsplash otomatis berdasarkan kata kunci nama produk
                let unsplashFallback = 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800'; // Default coklat
                const nameLower = item.name.toLowerCase();
                if (nameLower.includes('straw') || nameLower.includes('berry') || nameLower.includes('buah')) {
                    unsplashFallback = 'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=800'; // Strawberry
                } else if (nameLower.includes('croissant') || nameLower.includes('bread') || nameLower.includes('roti') || nameLower.includes('pastry')) {
                    unsplashFallback = 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=800'; // Croissant/Baking
                } else if (nameLower.includes('puding') || nameLower.includes('jelly') || nameLower.includes('pudding')) {
                    unsplashFallback = 'https://images.unsplash.com/photo-1548859135-2442436d547d?w=800'; // Pudding
                } else if (nameLower.includes('cheese') || nameLower.includes('keju')) {
                    unsplashFallback = 'https://images.unsplash.com/photo-1524351199679-46cddf530c04?w=800'; // Cheesecake
                }

                const imgSrc = (item.img && item.img.trim() !== '') ? item.img : unsplashFallback;
                const currentGradient = slideGradients[idx % slideGradients.length];
                const isActive = idx === 0 ? 'active' : '';

                // Link order WA untuk slide ini
                const waLinkEl = document.querySelector('.btn-whatsapp');
                const waNumber = waLinkEl ? waLinkEl.getAttribute('href').split('?')[0].split('/').pop() : '6287755620998';
                const waText = encodeURIComponent(`Halo kak, mau pesan ${item.name} ini kak?`);
                const waSlideHref = `https://wa.me/${waNumber}?text=${waText}`;

                slidesHtml += `
                    <div class="hero-slide ${isActive}" style="background: ${currentGradient};" data-slide-index="${idx}">
                        <div class="hero-slide-content">
                            <span class="hero-slide-category">${item.category}</span>
                            <h2 class="hero-slide-title">${item.name}</h2>
                            <p class="hero-slide-desc">${item.desc || 'Nikmati sensasi kelezatan premium kami yang dibuat khusus dengan bahan-bahan terbaik.'}</p>
                            <div class="hero-slide-price">${item.price}</div>
                            <a href="${waSlideHref}" class="hero-slide-btn" target="_blank" rel="noopener noreferrer">View Details</a>
                        </div>
                        <div class="hero-slide-img-wrapper">
                            <img src="${imgSrc}" alt="${item.name}" class="hero-slide-img" onerror="this.onerror=null; this.src='${unsplashFallback}';">
                        </div>
                    </div>
                `;

                dotsHtml += `
                    <span class="slider-dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></span>
                `;
            });

            slider.innerHTML = slidesHtml;
            dotsContainer.innerHTML = dotsHtml;
        }

        // Inisialisasi Interval Pemutaran Otomatis (10 detik)
        function initSlider() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 10000);
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.hero-slide');
            if (slides.length <= 1) return;

            let nextIdx = (currentSlideIndex + 1) % slides.length;
            goToSlide(nextIdx);
        }

        // Pindah ke slide tertentu
        function goToSlide(targetIdx) {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.slider-dot');
            if (slides.length === 0) return;

            // Reset current active slide
            slides[currentSlideIndex].classList.remove('active');
            if (dots[currentSlideIndex]) dots[currentSlideIndex].classList.remove('active');

            // Set new active slide
            currentSlideIndex = targetIdx;
            slides[currentSlideIndex].classList.add('active');
            if (dots[currentSlideIndex]) dots[currentSlideIndex].classList.add('active');

            // Reset interval agar hitungan 10 detik dimulai dari 0 saat di-klik manual
            initSlider();
        }

        // Jalankan render setelah seluruh elemen dimuat
        document.addEventListener('DOMContentLoaded', renderMenu);
    </script>

</body>
</html>
